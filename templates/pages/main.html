{% extends 'base.html' %}

{% block title %}code evaluating{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">

            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold">Code Evaluation</h1>
                <p class="lead text-secondary">
                    Compare two code snippets and identify their differences.
                </p>
            </div>

            <form>
                <div class="row g-4">

                    <div class="col-12 col-md-6">
                        <label for="code1" class="form-label fw-semibold">
                            Correct or First Code
                        </label>

                        <textarea
                            class="form-control font-monospace"
                            id="code1"
                            name="code1"
                            rows="14"
                            placeholder="Paste correct or simply first code snippet here..."
                            required
                        >
def test_function(a: int, b: int) -> int:
    return a + b

print(test_function(10, 20)) # 30
                        </textarea>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="code2" class="form-label fw-semibold">
                            Other Code
                        </label>

                        <textarea
                            class="form-control font-monospace"
                            id="code2"
                            name="code2"
                            rows="14"
                            placeholder="Paste second code snippet here..."
                            required
                        >
def my_func(a: float, b: float) -> str:
    return a + b

print(my_func(10, 20)) # 30
                        </textarea>
                    </div>

                    <div class="col-12 text-center">
                        <button
                            type="submit"
                            id="evaluate-btn"
                            class="btn btn-primary btn-lg px-5"
                        >
                            Evaluate
                        </button>
                    </div>

                </div>
            </form>

        </div>
    </div>
</section>
{% endblock %}
